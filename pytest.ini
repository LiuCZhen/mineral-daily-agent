[pytest]
testpaths = tests
# tmpdir 插件在受限环境（系统 TEMP 不可枚举）下会让 pytest 自身报权限错误；
# tests/conftest.py 提供了等价的 tmp_path / tmp_path_factory（落在 workspace 内），
# 因此这里直接关掉内置插件。
addopts = -q -p no:cacheprovider -p no:tmpdir
python_files = test_*.py
filterwarnings =
    error::DeprecationWarning:servers.*
    error::DeprecationWarning:agent.*
